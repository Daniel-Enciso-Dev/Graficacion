<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Graficacion</title>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Graficacion</h1>
    </header>
    <nav>
        <button onclick="drawPointPrompt()">Punto</button>
        <button onclick="drawLinePrompt()">Linea</button>
        <button onclick="drawRectanglePrompt()">Rectangulo</button>
        <button onclick="drawCirclePrompt()">Circulo</button>
        <button onclick="drawTrianglePrompt()">Triangulo</button>
        <button onclick="drawPolygonPrompt()">Poligono</button>
        <button onclick="drawTextPrompt()">Texto</button>
        <button onclick="drawImagePrompt()">Imagen</button>
        <button onclick="drawCircleWithMath()">Circulo Matemático</button>
        <button onclick="startClock()">Iniciar Reloj</button>
        
        <button onclick="drawStar()">Estrella Original</button>
        <button onclick="rotateStar()">Girar Estrella (Auto)</button>
        <button onclick="rotateStarStep()">5° Girar Estrella X</button>
        <button onclick="rotateStarY()">Girar Estrella Y</button>
        <button onclick="rotateStarZ()">Girar Estrella Z</button>

        <button onclick="rotatePyramid('X', 5)">Pirámide Girar X</button>
        <button onclick="rotatePyramid('Y', 5)">Pirámide Girar Y</button>
        <button onclick="rotatePyramid('Z', 5)">Pirámide Girar Z</button>

        <button onclick="clearCanvas()">Limpiar</button>
    </nav>
    <main>
        <canvas id="myCanvas" width="600" height="600"></canvas>
    </main>
    <footer>
        <p>Derechos reservados &copy; 2026</p>
        <p>Tecnologico de Tlajomulco</p>
        <p>Materia: Graficacion</p>
        <p>Alumno: Gilberto Daniel Cornejo Enciso</p>
    </footer>
</body>
</html>
